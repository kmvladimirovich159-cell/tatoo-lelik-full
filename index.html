<!-- PORTFOLIO -->

<section
  class="works section section-dark"
  id="works"
>

  <div class="container">

    <div class="section-heading reveal">

      <div>

        <p class="eyebrow">
          Портфолио
        </p>

        <h2>
          Мои <em>работы</em>
        </h2>

      </div>

      <p>
        Выберите направление,
        чтобы посмотреть работы в нужном стиле.
      </p>

    </div>


    <!-- FILTERS -->

    <div
      class="portfolio-filters reveal"
      role="tablist"
      aria-label="Фильтр портфолио"
    >

      <button
        class="filter-btn active"
        type="button"
        data-filter="all"
        role="tab"
        aria-selected="true"
      >
        Все
        <span>13</span>
      </button>


      <button
        class="filter-btn"
        type="button"
        data-filter="minimalism"
        role="tab"
        aria-selected="false"
      >
        Минимализм
        <span>01</span>
      </button>


      <button
        class="filter-btn"
        type="button"
        data-filter="lettering"
        role="tab"
        aria-selected="false"
      >
        Надписи
        <span>02</span>
      </button>


      <button
        class="filter-btn"
        type="button"
        data-filter="floristics"
        role="tab"
        aria-selected="false"
      >
        Флористика
        <span>05</span>
      </button>


      <button
        class="filter-btn"
        type="button"
        data-filter="graphics"
        role="tab"
        aria-selected="false"
      >
        Графика
        <span>03</span>
      </button>


      <button
        class="filter-btn"
        type="button"
        data-filter="custom"
        role="tab"
        aria-selected="false"
      >
        Индивидуальный дизайн
        <span>02</span>
      </button>

    </div>


    <!-- GALLERY -->

    <div
      class="gallery"
      id="portfolioGallery"
    >


      <!-- 01. ФЛОРИСТИКА -->

      <button
        class="gallery-item large reveal"
        type="button"
        data-category="floristics"
        data-full="assets/images/portfolio/IMG_0502.PNG"
        data-caption="Флористика — цветочная композиция"
      >

        <img
          src="assets/images/portfolio/IMG_0502.PNG"
          alt="Флористическая татуировка на руке"
          loading="lazy"
        >

        <span class="gallery-label">
          Флористика
        </span>

        <span class="gallery-arrow">
          ↗
        </span>

      </button>


      <!-- 02. ФЛОРИСТИКА -->

      <button
        class="gallery-item reveal"

    <!-- EMPTY STATE -->

    <div
      class="portfolio-empty"
      id="portfolioEmpty"
    >

      <span>✦</span>

      <h3>
        В этой категории пока нет работ
      </h3>

      <p>
